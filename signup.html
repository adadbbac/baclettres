<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b4356"><link rel="manifest" href="manifest.webmanifest"><title>إنشاء حساب — أدب باك</title><link rel="stylesheet" href="student-space.css"></head><body class="student-shell"><header class="topbar"><a class="brand" href="index.html">أدب باك</a><a class="ghost" href="student-login.html">تسجيل الدخول</a></header><main class="auth-wrap"><section class="auth-card"><span class="eyebrow">فضاء التلميذ</span><h1>إنشاء حساب جديد</h1><p>أنشئ حسابك في أدب باك. يبدأ الحساب بوضع «مستخدم جديد» إلى أن يوثّقه الأستاذ.</p><form id="signupForm"><label>الاسم واللقب<input id="name" required autocomplete="name"></label><label>المعهد<input id="school" required></label><label>رقم الهاتف<input id="phone" required inputmode="tel" autocomplete="tel"></label><label>كلمة العبور<input id="password" required type="password" minlength="4" autocomplete="new-password"></label><label class="check"><input type="checkbox" required> أوافق على إنشاء الحساب واستعمال بياناته لأغراض المنصة التعليمية.</label><button class="primary-btn">إنشاء الحساب</button></form><div id="msg" class="form-msg"></div><div class="auth-foot">لديك حساب؟ <a href="student-login.html">تسجيل الدخول</a></div></section></main><script src="auth.js"></script><script>const f=document.getElementById('signupForm'),m=document.getElementById('msg');f.addEventListener('submit',e=>{e.preventDefault();const u={name:document.getElementById('name').value.trim(),school:document.getElementById('school').value.trim(),phone:document.getElementById('phone').value.trim(),password:document.getElementById('password').value,status:'new',progress:0,favorites:[],messages:[],createdAt:new Date().toISOString()};if(window.AdabAuth&&AdabAuth.register&&!AdabAuth.register(u)){m.textContent='يوجد حساب بهذا الرقم بالفعل.';return}location.href='student.html'});</script></body></html>
