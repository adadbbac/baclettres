<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b4356"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="admin.css"><title>دخول الأستاذ — أدب باك</title></head><body><main class="login-page"><section class="login-card"><span class="eyebrow">أدب باك · فضاء الإدارة</span><h1>فضاء الأدمن الأستاذ</h1><p>هذه بوابة خاصة بإدارة المنصة. لا تظهر وظائف الإدارة للمستخدمين العاديين.</p><form id="f"><label>اسم الدخول<input id="u" required autocomplete="username"></label><label>كلمة العبور<input id="p" type="password" required autocomplete="current-password"></label><button class="btn">الدخول إلى لوحة الإدارة</button></form><div id="e" class="error"></div><div class="secure">الدخول الافتراضي التجريبي: الأستاذ / AdabBac@2026 — يُستحسن تغييره عند ربط المنصة بخادم وقاعدة بيانات.</div><p><a href="index.html">العودة إلى الصفحة الرئيسية</a></p></section></main><script src="admin.js"></script><script>document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;if(AdabAdmin.login(u,p))location.href='admin.html';else document.getElementById('e').textContent='بيانات الدخول غير صحيحة.'});</script></body></html>
