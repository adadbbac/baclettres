<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b4356"><link rel="manifest" href="manifest.webmanifest"><title>تسجيل الدخول — أدب باك</title><link rel="stylesheet" href="student-space.css"></head><body class="student-shell"><header class="topbar"><a class="brand" href="index.html">أدب باك</a><a class="ghost" href="index.html">الصفحة الرئيسية</a></header><main class="auth-wrap"><section class="auth-card"><span class="eyebrow">فضاء التلميذ</span><h1>تسجيل الدخول</h1><p>ادخل إلى حسابك لمتابعة رحلتك التعليمية في أدب باك.</p><form id="loginForm"><label>رقم الهاتف<input id="phone" required inputmode="tel" autocomplete="tel"></label><label>كلمة العبور<input id="password" required type="password" autocomplete="current-password"></label><button class="primary-btn">دخول إلى الفضاء</button></form><div id="msg" class="form-msg"></div><div class="auth-foot">ليس لديك حساب؟ <a href="signup.html">إنشاء حساب جديد</a></div><div class="help-note">نسيت كلمة العبور؟ اتصل بالأستاذ وأرسل رسالة من فضاء الأستاذ لاسترجاعها.</div></section></main><script src="auth.js"></script><script>
const form=document.getElementById('loginForm'),msg=document.getElementById('msg');form.addEventListener('submit',e=>{e.preventDefault();const p=document.getElementById('phone').value.trim(),pw=document.getElementById('password').value,u=AdabAuth.login(p,pw);if(!u){msg.textContent='رقم الهاتف أو كلمة العبور غير صحيحة.';return}location.href='student.html'});
</script></body></html>
